[package]
name = "flops-ceiling"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Reproducible FP32, BF16, FP8, and NVFP4 GPU benchmarks for NVIDIA GPUs"
license = "Apache-2.0"
default-run = "flops-ceiling"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cutile = { git = "https://github.com/NVlabs/cutile-rs", rev = "cc720f182f38bf46527753caa340e78d6d5fa3cc", optional = true }

[features]
cutile = ["dep:cutile"]

[profile.release]
lto = "thin"
codegen-units = 1
